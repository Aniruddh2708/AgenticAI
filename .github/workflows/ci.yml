name: Application checks

on:
  push:
    branches: [main, codex/free-accounts-and-data-verification, codex/credible-forecast-development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VIBEFINANCE_EMBEDDINGS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select compatible Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.lock
            requirements-auth.lock
            requirements-production.lock
      - name: Install locked packages
        run: python -m pip install --require-hashes -r requirements-ci.lock -r requirements-auth.lock -r requirements-production.lock
      - name: Run application tests
        env:
          VIBEFINANCE_STATE_DIR: ${{ runner.temp }}/vibefinance-ci
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Publish sanitized test diagnostics
        if: ${{ always() }}
        shell: python
        run: |
          import builtins
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          report = Path("pytest-results.xml")
          known_exceptions = {
              name for name, value in vars(builtins).items()
              if isinstance(value, type) and issubclass(value, BaseException)
          }

          def safe_name(value):
              # Parameter IDs may contain fixture values. Report code names only.
              value = value.split("[", 1)[0]
              if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*", value):
                  return value[:240]
              return "unknown"

          def exception_type(problem):
              # Never print messages, assertions, values, traceback or captured output.
              for attribute in ("type", "message"):
                  value = problem.get(attribute, "").strip()
                  match = re.match(r"^(?:[A-Za-z_]\w*\.)*([A-Za-z_]\w*)(?=:|$)", value)
                  if match and match.group(1) in known_exceptions:
                      return match.group(1)
              return "unknown exception type"

          try:
              cases = list(ET.parse(report).getroot().iter("testcase"))
          except (OSError, ET.ParseError):
              print("::notice::JUnit diagnostics unavailable; inspect the original failed step.")
          else:
              failed = skipped = 0
              for case in cases:
                  problems = [child for child in case if child.tag in {"failure", "error"}]
                  if problems:
                      failed += 1
                      node = safe_name(case.get("classname", "")) + "::" + safe_name(case.get("name", ""))
                      print("::error title=Failed test::" + node + "; " + exception_type(problems[0]))
                  elif case.find("skipped") is not None:
                      skipped += 1
              print(f"JUnit cases: total={len(cases)}, passed={len(cases)-failed-skipped}, failed={failed}, skipped={skipped}")
      - name: Exercise rendered dashboard with isolated API
        env:
          VIBEFINANCE_STATE_DIR: ${{ runner.temp }}/vibefinance-ci
        run: python scripts/check_dashboard_extended.py

  production-postgres:
    name: Account isolation and recovery on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIBEFINANCE_EMBEDDINGS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements.lock
            requirements-auth.lock
            requirements-production.lock
      - name: Install verified dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock -r requirements-auth.lock -r requirements-production.lock
      - name: Exercise disposable PostgreSQL with verified TLS
        env:
          VIBEFINANCE_STATE_DIR: ${{ runner.temp }}/vibefinance-production-ci
        run: python scripts/check_production_storage.py
