name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VIBEFINANCE_EMBEDDINGS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select compatible Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked packages
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run application tests
        env:
          VIBEFINANCE_STATE_DIR: ${{ runner.temp }}/vibefinance-ci
        run: python -m pytest -q
      - name: Exercise rendered dashboard with isolated API
        env:
          VIBEFINANCE_STATE_DIR: ${{ runner.temp }}/vibefinance-ci
        run: python scripts/check_dashboard_extended.py
